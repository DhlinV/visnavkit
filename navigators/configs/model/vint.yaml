# ViNT-style recipe (arXiv:2306.14846): EfficientNet-B0 frame encoder + multi-layer
# transformer over the frame sequence + deterministic waypoint regression. Adapted to
# this repo's goal-free, fixed-horizon setting (no goal token / topological graph).
defaults:
  - base
  - _self_

modules:
  vision_encoder:
    backbone_name: efficientnet_b0
    out_indices: [2, 3, 4]
    act_layer: null # keep the backbone's native activations for pretrained weights
  action_decoder:
    summarizer:
      num_layers: 4
    plan_head:
      _target_: navigators.models.heads.waypoint_head.WaypointHead
      num_modes: 1
