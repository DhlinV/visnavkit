# @package _global_
defaults:
  - _self_

exp_name: baseline

# This is an example config for an experiment. An experiment should be a self contained file.
#
# When starting a new experiment, copy this file and override what you need. Keep ALL overrides
# in this file and keep the other files unchanged. The "other files" (e.g. model/base.yaml)
# encode specific "recipes" that should not be changed. For example, to test a new learning
# rate, don't change optimizer/adamw.yaml; in this file just place:
#
# optimizer:
#   lr: 1e-3
#
# Run with:
#
#  $ uv run navigators/train.py experiment=<name>
#
# train.yaml is configured s.t. experiment configs have the highest precedence.
# Keep experiments tracked in git; if one improves the baseline, fold it into train.yaml
# and delete the experiment file.
