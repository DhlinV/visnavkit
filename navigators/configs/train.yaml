defaults:
  - dataset: null
  - optimizer: adamw
  - model: base
  - metrics: open_loop
  - _self_
  - experiment: null

log_dir: logs
exp_name: baseline
seed: 42
plan_len_seconds: 3
plan_len_points: 10

trainer:
  kwargs:
    max_epochs: 50
    devices: 1
    precision: "bf16-mixed"
    check_val_every_n_epoch: 1
    num_sanity_val_steps: 2
    log_every_n_steps: 1
  logging:
    save_top_k_ckpts: 5
  resume:
    ckpt_path: null

common:
  crop_wh: [640, 480]
  downscale_factor: 2
  seq_length: 10
  step: 1

  plan_len_seconds: ${plan_len_seconds}
  plan_len_points: ${plan_len_points}

  data_root: /data/nav_clips  # placeholder until the first dataset lands
