[project]
name = "navigators"
version = "0.1.0"
description = "navigation IL stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy~=1.26",
  "timm>=1.0.11",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "torch==2.13.0",
  "torchvision>=0.24.0",
  "torchcodec>=0.10",
  "nvidia-dali-cuda130~=1.53.0; sys_platform == 'linux'",
  "lightning>=2.6.1",
  "wandb>=0.26.0",
  "onnx>=1.17.0",
  "onnxruntime>=1.20.1",
  "onnxslim>=0.1.43",
  "pytest>=8.4.2",
  "ruff==0.14.*",  # 0.16 changed default rule selection; match driving-model-track
]

[dependency-groups]
dev = [
  "ipykernel>=6.29.5",
  "matplotlib>=3.9.3",
]

[tool.uv]
package = true
# NOTE: torch 2.13 pins cudnn 9.20, but 9.24 has bug fixes specifically for blackwell gpus
# when we upgrade to torch 2.14 we can remove this (same as driving-model-track)
override-dependencies = [
  "nvidia-cudnn-cu13==9.24.0.43; sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
include = ["navigators*"]

[tool.setuptools.package-data]
"navigators.configs" = ["**/*.yaml"]

[tool.ruff]
line-length = 120
