# ViNT-style recipe (arXiv:2306.14846): EfficientNet-B0 frame encoder + multi-layer
# transformer over the frame sequence + deterministic waypoint regression. Adapted to
# this repo's goal-free, fixed-horizon setting (no goal token / topological graph).
defaults:
  - base
  - override /vision_encoder@_global_.vision_encoder: cnn_efficientnet
  - override /action_decoder@_global_.action_decoder: waypoint
  - override /temporal_encoder@_global_.temporal_encoder: causal_4layer
  - _self_
