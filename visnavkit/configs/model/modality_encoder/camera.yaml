# @package model.modality_encoders
# Per-frame pinhole calibration: intrinsics (B, F, 3, 3) already adjusted for the dataset's crop
# and downscale, extrinsics (B, F, 4, 4) camera-to-ego. The encoder normalizes the intrinsics by
# the resolution the policy is running at, so the same weights transfer across resolutions.
camera:
  _target_: visnavkit.models.modality.camera.PinholeCameraEncoder
  feat_size: ${model.feat_size}
  hidden: 128
  num_tokens: 1
  p_drop: 0.0  # modality dropout: also learn to act on clips with unknown calibration
