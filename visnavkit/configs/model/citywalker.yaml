# CityWalker-style recipe (CVPR 2025): frozen DINOv2 frame features + transformer over
# the frame sequence + deterministic waypoint regression. Adapted to this repo's
# goal-free, fixed-horizon setting (no goal coordinates).
defaults:
  - dinov2
  - override /action_decoder@_global_.action_decoder: waypoint
  - override /temporal_encoder@_global_.temporal_encoder: causal_4layer
  - _self_
