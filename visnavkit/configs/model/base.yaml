# Default recipe: FastViT-T8 frame encoder -> causal transformer -> goal-free -> MHP decoder.
defaults:
  - vision_encoder: fastvit_t8
  - temporal_encoder: causal
  - goal_encoder: none
  - modality_encoder: none
  - action_decoder: mhp
  - _self_

_target_: visnavkit.models.policy.NavigationPolicy
feat_size: 256

export_cfg:
  seq_step: ${common.step}
  seq_len: ${common.seq_length}

loss_cfg:
  vision_weight: 1
  action_weight: 2
