# Any timm feature-pyramid backbone (features_only). Presets below pin backbone_name/out_indices.
defaults:
  - base
  - _self_
_target_: visnavkit.models.vision.timm_cnn.TimmCNNEncoder
backbone_name: resnet18
out_indices: [-3, -2, -1]
act_layer: null  # null keeps native activations (needed for pretrained CNNs); gelu_tanh for export-friendly GELU
freeze_backbone: false
