# S2E-style (arXiv:2507.22028v2, ICLR 2026): the camera-ready architecture — a DINOv3 encoder
# (the paper does not state the variant), a 6-layer 8-head stack over 768-d tokens with
# feed-forward 3072, and an anchor-guided GMM decoder with a per-mode velocity scale. Its anchors
# are k-means centroids over the corpus, so pass an NPZ from `visnavkit-dataset command=anchors
# num_anchors=64` — 64 is the count the paper's ablation prefers. Version v1 of the paper
# described an EfficientNet-B0 encoder over 4 layers; this follows v2.
# Differences: the paper masks its point and image goals jointly (0.35 neither, 0.20 image only,
# 0.40 point only, 0.05 both), which leaves the point goal missing 55% of the time here; the RL
# post-training stage (residual-attention blocks, PPO) is out of scope.
defaults:
  - base
  - override vision_encoder: dinov3_s
  - override temporal_encoder: causal
  - override goal_encoder: point
  - override action_decoder: anchor
  - _self_

feat_size: 768

temporal_encoder:
  num_layers: 6
  ff_dim: 3072

goal_encoder:
  p_drop: 0.55

action_decoder:
  anchors:
    num_anchors: 64
