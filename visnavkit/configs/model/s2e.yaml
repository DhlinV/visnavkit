# S2E-style (arXiv:2507.22028): frozen DINOv3 ViT encoder, point goal (distance, cos, sin) with
# goal dropout, multi-hypothesis decoder. The paper's RL post-training stage is out of scope.
defaults:
  - base
  - override vision_encoder: dinov3_s
  - override goal_encoder: point
  - _self_

goal_encoder:
  p_drop: 0.5
