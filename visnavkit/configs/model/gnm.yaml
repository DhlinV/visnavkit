# GNM-style recipe (arXiv:2210.03370): small CNN over the stacked frame pair, no temporal
# attention, deterministic waypoint regression. Adapted to this repo's goal-free,
# fixed-horizon setting (no goal image, x/y/v targets).
defaults:
  - base
  - _self_

modules:
  vision_encoder:
    backbone_name: mobilenetv2_100
    out_indices: [2, 3, 4]
    act_layer: null # keep the backbone's native activations for pretrained weights
  action_decoder:
    temporal_encoder:
      num_layers: 0
    plan_head:
      _target_: visnavkit.models.heads.waypoint_head.WaypointHead
      num_modes: 1
